name = "sagent-edge-ingress"
main = "worker.js"
compatibility_date = "2024-04-01"

[vars]
ENFORCE_TURNSTILE = "false"
CLOUD_RUN_ORIGIN_URL = "https://sagent-xxxxx-uc.a.run.app"
# Sensitive credentials must be set using: npx wrangler secret put <KEY>
# ORIGIN_SECRET and TURNSTILE_SECRET_KEY are configured via Cloudflare Secrets
ORIGIN_SECRET = "REPLACE_WITH_WRANGLER_SECRET"
TURNSTILE_SECRET_KEY = "REPLACE_WITH_TURNSTILE_SECRET"

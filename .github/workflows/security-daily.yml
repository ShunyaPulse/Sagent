name: Security - Daily Deep Scan

on:
  schedule:
    # Runs everyday at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Trivy: Deep Container & Dockerfile Vulnerability Scanning
  # ----------------------------------------------------------------------------
  trivy-scan:
    name: Container & OS Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Container
        run: docker build -t sagent:latest .

      - name: Scan Container Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'sagent:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan IaC & Dockerfile Misconfigurations
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'HIGH,CRITICAL'

  # ----------------------------------------------------------------------------
  # 2. Promptfoo: Autonomous Agent Prompt Injection & Guardrail Red-Teaming
  # ----------------------------------------------------------------------------
  agent-guardrails:
    name: AI Guardrails & Prompt Injection (Promptfoo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Promptfoo Security Evaluation
        run: npx -y promptfoo eval -c promptfooconfig.yaml --no-progress-bar

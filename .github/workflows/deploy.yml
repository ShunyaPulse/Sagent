name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Authenticate to Google Cloud
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          trap 'rm -f /tmp/gcp-sa-key.json' EXIT
          node scripts/clean-gcp-key.cjs /tmp/gcp-sa-key.json
          gcloud auth activate-service-account --key-file=/tmp/gcp-sa-key.json
          gcloud config set project sage-webbing-422513-q0

      - name: Deploy to Google Cloud Run (Zero-Cost Scale-to-Zero)
        env:
          SERVICE_NAME: "sagentic"
          REGION: "asia-south1"
          GCP_PROJECT: "sage-webbing-422513-q0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LORA_NAME: ${{ secrets.CLOUDFLARE_LORA_NAME }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')
          echo "Deploying container image: $IMAGE to Cloud Run service: $SERVICE_NAME"

          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$GCP_PROJECT" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --cpu-throttling \
            --port=8080 \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${DATABASE_URL},AUTH_SECRET=${AUTH_SECRET},ORIGIN_SECRET=${ORIGIN_SECRET},GEMINI_API_KEY=${GEMINI_API_KEY},CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID},CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN},CLOUDFLARE_LORA_NAME=${CLOUDFLARE_LORA_NAME},REDIS_URL=${REDIS_URL}"

          echo "Deployment complete! Live Cloud Run URL:"
          gcloud run services describe "$SERVICE_NAME" --region="$REGION" --project="$GCP_PROJECT" --format='value(status.url)'

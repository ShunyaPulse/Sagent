name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-deploy:
    name: Build Container & Deploy to Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Google Cloud Credentials
        id: gcp-auth-prep
        env:
          RAW_GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            let raw = process.env.RAW_GCP_SA_KEY || "";
            let obj = JSON.parse(raw);
            if (obj.private_key && obj.private_key.includes("\\n")) {
              obj.private_key = obj.private_key.replace(/\\n/g, "\n");
            }
            const clean = JSON.stringify(obj);
            const delimiter = "EOF_" + Math.random().toString(36).slice(2);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `credentials_json<<${delimiter}\n${clean}\n${delimiter}\n`);
          '

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ steps.gcp-auth-prep.outputs.credentials_json }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Google Cloud Run (Zero-Cost Scale-to-Zero)
        env:
          SERVICE_NAME: "sagentic"
          REGION: "asia-south1"
          GCP_PROJECT: "sage-webbing-422513-q0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_LORA_NAME: ${{ secrets.CLOUDFLARE_LORA_NAME }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" | tr '[:upper:]' '[:lower:]')
          echo "Deploying container image: $IMAGE to Cloud Run service: $SERVICE_NAME"

          gcloud run deploy "$SERVICE_NAME" \
            --image="$IMAGE" \
            --region="$REGION" \
            --project="$GCP_PROJECT" \
            --platform=managed \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=512Mi \
            --concurrency=80 \
            --cpu-throttling \
            --port=8080 \
            --set-env-vars="NODE_ENV=production,DATABASE_URL=${DATABASE_URL},AUTH_SECRET=${AUTH_SECRET},ORIGIN_SECRET=${ORIGIN_SECRET},GEMINI_API_KEY=${GEMINI_API_KEY},CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID},CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN},CLOUDFLARE_LORA_NAME=${CLOUDFLARE_LORA_NAME},REDIS_URL=${REDIS_URL}"
